[project]
name = "tencent-docs-mcp"
version = "0.1.0"
description = "把本地 docx/xlsx/pptx 直接导入腾讯文档的 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tencent-docs-mcp = "tencent_docs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tencent_docs_mcp"]
