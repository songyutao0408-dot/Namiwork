<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中华五千年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* Layout: a small cinema. Deep indigo surround, one 16:9 sheet of pale celadon paper drawn in blue-black ink
   (blue-and-white porcelain), vermilion only for seals and fire. Subtitles sit on the sheet; scrubber below. */
:root{
  --night:#10152a; --night-2:#1b2342; --night-3:#2a3460;
  --paper:#EDF1EA; --ink:#1C2747; --ink-soft:#64708F; --cobalt:#2F55A8; --mist:#B9C4D9;
  --seal:#D2412B; --gold:#E6A92E; --moon:#F2D98C;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-fun:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--paper)}
[hidden]{display:none!important}
body{font-family:var(--f-ui);padding-inline:16px;padding-block:18px 28px}
.wrap{width:min(100%,max(560px,calc((100svh - 210px)*1.7778)));margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--f-brush);font-weight:400;font-size:clamp(26px,3.4vw,36px);letter-spacing:.06em;color:var(--paper)}
.top p{margin:0;font-size:13px;color:var(--mist);letter-spacing:.04em}
.screen{position:relative;container-type:inline-size}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--paper);border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45);container-type:inline-size}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ink{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.blush{stroke:none;opacity:.32}
.sil{fill:var(--paper);stroke:none}
.fun{font-family:var(--f-fun);fill:var(--ink)}
.brush{font-family:var(--f-brush);fill:var(--ink)}
.popper{transform-box:fill-box;transform-origin:center}
#year{font-family:var(--f-fun);fill:var(--ink-soft);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sub{position:absolute;left:5%;right:5%;bottom:2.6%;margin:0;text-align:center;font-family:var(--f-fun);color:var(--ink);
  font-size:2.5cqw;line-height:1.35;text-wrap:balance;min-height:2.7em;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
@container (max-width:620px){
  .sub{position:static;color:var(--paper);font-size:15px;min-height:3.1em;padding-top:10px;align-items:flex-start}
}
.start{position:absolute;left:50%;top:67%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.2cqw;
  background:none;border:0;padding:8px;cursor:pointer;color:var(--ink);font:inherit}
.start .seal{width:clamp(58px,10cqw,124px);aspect-ratio:1;background:var(--seal);color:var(--paper);font-family:var(--f-brush);
  font-size:clamp(24px,4.3cqw,54px);display:grid;place-items:center;border-radius:10%;transform:rotate(-5deg);
  box-shadow:0 6px 0 rgba(28,39,71,.18);transition:transform .2s ease}
.start:hover .seal,.start:focus-visible .seal{transform:rotate(0) scale(1.06)}
.start small{font-family:var(--f-fun);font-size:clamp(12px,1.7cqw,19px);color:var(--ink-soft);background:var(--paper);padding:2px 10px;border-radius:99px}
.start:focus-visible{outline:none}
.start:focus-visible small{outline:2px solid var(--cobalt);outline-offset:2px}
.track{position:relative;display:flex;gap:3px;padding-block:6px 2px;cursor:pointer;touch-action:none;container-type:inline-size;user-select:none}
.seg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--mist);font:inherit}
.seg .bar{height:6px;border-radius:3px;background:var(--night-3);overflow:hidden;width:100%}
.seg .fill{display:block;height:100%;width:0;background:var(--paper)}
.seg.on .fill{background:var(--seal)}
.seg .lb{font-family:var(--f-fun);font-size:12px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center;opacity:.75}
.seg.on .lb{color:var(--paper);opacity:1}
@container (max-width:760px){.seg .lb{display:none}}
.seg:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--night-3);background:var(--night-2);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.btn:hover{background:var(--night-3)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.main{width:46px;height:46px;background:var(--seal);border-color:var(--seal)}
.btn.main:hover{background:#e04c35}
.chap{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:2px}
.chap b{font-family:var(--f-fun);font-weight:400;font-size:18px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap span{font-size:12px;color:var(--mist);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--ink-soft);margin:0;color:var(--mist);opacity:.8}
@media (prefers-reduced-motion:reduce){.start .seal{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>中华五千年</h1>
    <p>线稿动画 · 21 个章节 · <span id="totalTxt">约 2 分钟</span></p>
  </header>

  <div class="screen" id="screen">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="中华五千年线稿动画">
        <defs id="defs">
          <filter id="b0" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
          <filter id="b1" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
          <filter id="b2" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
        </defs>
        <g id="art" filter="url(#b0)"></g>
        <text id="year" x="86" y="88" font-size="32"></text>
      </svg>
      <button class="start" id="start" type="button" aria-label="开始播放">
        <span class="seal">开播</span>
        <small id="startHint">建议打开声音</small>
      </button>
    </div>
    <p class="sub" id="cap" aria-live="polite"></p>
  </div>

  <div class="track" id="track" aria-label="章节时间轴"></div>

  <div class="bar-row">
    <button class="btn main" id="playBtn" type="button" aria-label="播放"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <button class="btn" id="prevBtn" type="button" aria-label="上一章"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn" id="nextBtn" type="button" aria-label="下一章"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <div class="chap"><b id="chapName">开场</b><span id="timeTxt">0:00 / 0:00</span></div>
    <button class="btn" id="muteBtn" type="button" aria-label="静音"><svg viewBox="0 0 24 24" id="muteIco"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <p class="hint">空格键播放 / 暂停，← → 切换章节，M 静音。点时间轴任意位置可跳转。</p>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const art=$('art'),DEFS=$('defs'),yearEl=$('year'),capEl=$('cap');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let _s=7;const rnd=()=>{_s=(_s*16807)%2147483647;return(_s-1)/2147483646;};
const J=a=>(rnd()*2-1)*a;
const f1=n=>Math.round(n*10)/10;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const easeOut=p=>1-Math.pow(1-p,3);
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const backOut=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
let CID=0;

/* ---------- sketchy geometry ---------- */
function cr(pts,closed){
  const p=closed?[pts[pts.length-1],...pts,pts[0],pts[1]]:[pts[0],...pts,pts[pts.length-1]];
  let d=`M${f1(p[1][0])},${f1(p[1][1])}`;
  for(let i=1;i<p.length-2;i++){const[a,b,c,e]=[p[i-1],p[i],p[i+1],p[i+2]];
    d+=`C${f1(b[0]+(c[0]-a[0])/6)},${f1(b[1]+(c[1]-a[1])/6)} ${f1(c[0]-(e[0]-b[0])/6)},${f1(c[1]-(e[1]-b[1])/6)} ${f1(c[0])},${f1(c[1])}`;}
  return d;
}
function wline(x1,y1,x2,y2){const mx=(x1+x2)/2,my=(y1+y2)/2,L=Math.hypot(x2-x1,y2-y1)||1,o=J(Math.min(5,L*.03));
  return `M${f1(x1+J(.8))},${f1(y1+J(.8))}Q${f1(mx-(y2-y1)/L*o)},${f1(my+(x2-x1)/L*o)} ${f1(x2+J(.8))},${f1(y2+J(.8))}`;}
function wpoly(pts,closed){const P=closed?[...pts,pts[0]]:pts;let d=`M${f1(P[0][0])},${f1(P[0][1])}`;
  for(let i=1;i<P.length;i++){const[x1,y1]=P[i-1],[x2,y2]=P[i];const L=Math.hypot(x2-x1,y2-y1)||1,o=J(Math.min(3.5,L*.025));
    d+=`Q${f1((x1+x2)/2-(y2-y1)/L*o)},${f1((y1+y2)/2+(x2-x1)/L*o)} ${f1(x2+J(.6))},${f1(y2+J(.6))}`;}
  return closed?d+'Z':d;}
function circ(cx,cy,rx,ry,over){const n=12,a0=rnd()*6.283,pts=[];for(let i=0;i<=n;i++){const a=a0+i/n*(6.283+over),k=1+J(.02);pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}return cr(pts,false);}
const CIRC=(cx,cy,r)=>`M${cx-r},${cy}a${r},${r} 0 1,0 ${2*r},0a${r},${r} 0 1,0 ${-2*r},0Z`;
function star(cx,cy,r,rot){const p=[];for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*.382:r;p.push(f1(cx+Math.cos(a)*rr)+','+f1(cy+Math.sin(a)*rr));}return 'M'+p.join('L')+'Z';}
function wave(x0,x1,y,amp,per,ph=0,step=20){const p=[];for(let x=x0;x<=x1+.1;x+=step)p.push([x,y+Math.sin(x/per+ph)*amp]);return p;}
const SIL='M-18,-104 Q-28,-52 -46,-4 Q0,4 46,-4 Q28,-52 18,-104Z'+CIRC(0,-140,37);

/* ---------- scene builder ---------- */
class D{
  constructor(sc,p,sw=3.6,color=null){this.sc=sc;this.p=p;this.sw=sw;this.color=color;this.gap=null;}
  at(t){this.sc.cur=t;return this;}
  _time(o,len){const t=o.t??this.sc.cur;const dur=o.dur??Math.min(1.1,Math.max(.2,len/1100));
    this.sc.cur=t+(o.gap??this.gap??Math.min(.14,dur*.5));return[t,dur];}
  path(d,o={}){
    const e=mk('path',{d,class:o.cls||'ink'},this.p);
    e.style.strokeWidth=o.w??this.sw;const c=o.color??this.color;if(c)e.style.stroke=c;
    if(o.fill){e.style.fill=o.fill;e.style.fillOpacity=0;}else if(o.paper){e.style.fill='var(--paper)';e.style.fillOpacity=0;}
    const len=e.getTotalLength()+2;const[t,dur]=this._time(o,len);
    e.style.strokeDasharray=`${len} ${len+20}`;e.style.strokeDashoffset=len;
    this.sc.items.push({k:'draw',e,len,t,dur,fill:!!o.fill,paper:!!o.paper&&!o.fill,o:-1});return e;}
  line(x1,y1,x2,y2,o){return this.path(wline(x1,y1,x2,y2),o);}
  poly(pts,o={}){return this.path(wpoly(pts,o.closed),o);}
  curve(pts,o={}){return this.path(cr(pts.map(p=>[p[0]+J(1),p[1]+J(1)]),o.closed),o);}
  circle(cx,cy,r,o={}){return this.path(circ(cx,cy,r,o.ry??r,o.over??.3),o);}
  text(str,x,y,o={}){
    const size=o.size||32;const e=mk('text',{x,y,'font-size':size,'text-anchor':o.anchor||'middle',class:o.cls||'fun'},this.p);
    if(o.color)e.style.fill=o.color;
    const chars=[...str],mode=o.mode||'type',t=o.t??this.sc.cur;
    const dur=o.dur??(mode==='type'?Math.max(.2,chars.length/14):mode==='wipe'?.8:.35);
    this.sc.cur=t+(o.gap??this.gap??.1);
    const it={k:mode,e,t,dur,chars,n:-1};
    if(mode==='wipe'){const id='w'+(++CID),w=o.ww||chars.length*size*1.04,a=o.anchor||'middle',x0=a==='middle'?x-w/2:a==='end'?x-w:x;
      const cp=mk('clipPath',{id},DEFS);it.r=mk('rect',{x:x0-14,y:y-size*1.15,width:0,height:size*1.6},cp);it.w=w+28;e.setAttribute('clip-path',`url(#${id})`);}
    if(mode==='pop')e.classList.add('popper');
    e.textContent=mode==='type'?'':str;
    this.sc.items.push(it);return e;}
  g(o={}){const e=mk('g',{},this.p);if(o.tf)e.setAttribute('transform',o.tf);
    const d=new D(this.sc,e,o.sw??this.sw,o.color??this.color);d.gap=this.gap;
    if(o.move)this.sc.items.push({k:'move',e,fn:o.move,base:o.tf||''});return d;}
  popg(t,o={}){const d=this.g(o);d.p.classList.add('popper');this.sc.items.push({k:'pop',e:d.p,t,dur:o.dur||.38});return d;}
  sfx(type,t){this.sc.sfx.push({t:t??this.sc.cur,type});}
  title(name,era){const n=[...name].length,size=Math.min(124,440/n),y=112+size*.92;
    this.text(name,84,y,{size,cls:'brush',mode:'wipe',t:.15,dur:.75,anchor:'start'});
    this.text(era,88,y+46,{size:27,mode:'fade',t:.65,color:'var(--seal)',anchor:'start'});
    this.sc.cur=.5;}
  bubble(x,y,str,o={}){
    const size=o.size||32,n=[...str].length,w=o.w||n*size*1.02+46,h=size+32,x0=x-w/2,y0=y-h/2,r=18;
    const[tx,ty]=o.tail||[x-w*.15,y0+h+34];const below=ty>y;
    const bx=Math.max(x0+r+18,Math.min(x0+w-r-18,tx));
    let p=`M${x0+r},${y0}`;
    if(!below)p+=`L${bx-14},${y0}L${tx},${ty}L${bx+14},${y0}`;
    p+=`L${x0+w-r},${y0}Q${x0+w},${y0} ${x0+w},${y0+r}L${x0+w},${y0+h-r}Q${x0+w},${y0+h} ${x0+w-r},${y0+h}`;
    if(below)p+=`L${bx+14},${y0+h}L${tx},${ty}L${bx-14},${y0+h}`;
    p+=`L${x0+r},${y0+h}Q${x0},${y0+h} ${x0},${y0+h-r}L${x0},${y0+r}Q${x0},${y0} ${x0+r},${y0}Z`;
    const t=o.t??this.sc.cur,keep=this.sc.cur;
    const g=this.popg(t,{dur:.32});
    g.path(p,{t,dur:.3,paper:true,w:3});
    g.text(str,x,y+size*.36,{t:t+.18,size,cls:o.font==='brush'?'brush':'fun',mode:'type',dur:o.tdur});
    if(o.font==='brush'&&o.color)g.p.lastChild.style.fill=o.color;
    this.sfx('pop',t);this.sc.cur=Math.max(keep,t+.3);return g;}
  seal(x,y,sz,ch,o={}){const t=o.t??this.sc.cur;const outer=this.g({tf:`rotate(${o.rot??-6},${x},${y})`});
    const g=outer.popg(t,{dur:.4});const r=mk('rect',{x:x-sz/2,y:y-sz/2,width:sz,height:sz,rx:sz*.1},g.p);r.style.fill='var(--seal)';
    const tx=mk('text',{x,y:y+sz*.3,'font-size':sz*.74,'text-anchor':'middle',class:'brush'},g.p);tx.style.fill='var(--paper)';tx.textContent=ch;
    this.sfx('stamp',t);return g;}
  tag(x,y,n,t){const g=this.popg(t,{dur:.35});const c=mk('path',{d:CIRC(x,y,20)},g.p);c.style.fill='var(--seal)';
    const tx=mk('text',{x,y:y+9,'font-size':26,'text-anchor':'middle',class:'fun'},g.p);tx.style.fill='var(--paper)';tx.textContent=n;this.sfx('pop',t);}
  person(x,y,s=1,o={}){
    if(o.t!=null)this.sc.cur=o.t;
    const t0=this.sc.cur;
    const d=this.g({tf:o.tf||`translate(${x},${y}) scale(${s})`,move:o.move,sw:(o.w||3.6)/(o.sx||s),color:o.color});
    d.gap=.065;
    if(!o.plain){const e=mk('path',{d:SIL,class:'sil'},d.p);this.sc.items.push({k:'show',e,t:t0});}
    d.circle(0,-140,36,{over:.15});
    if(!o.plain)face(d,o.mood||'normal');
    hat(d,o.hat);
    d.path('M-18,-104 Q-28,-52 -46,-4 Q0,4 46,-4 Q28,-52 18,-104');
    if(!o.plain){d.path('M-16,-104 L10,-66');d.path('M16,-104 L-3,-88');d.path('M-30,-50 Q0,-44 30,-50');}
    (o.hands||[[-40,-46],[40,-46]]).forEach((h,i)=>{const sx=i?20:-20,sy=-98,mx=(sx+h[0])/2+(i?12:-12),my=(sy+h[1])/2+6;
      d.curve([[sx,sy],[mx,my],h]);d.circle(h[0],h[1],6,{over:.1});});
    if(o.beard)d.path(o.beard===2?'M-12,-112 Q-12,-70 0,-58 Q12,-70 12,-112':'M-10,-112 Q-6,-94 0,-90 Q6,-94 10,-112');
    d.gap=null;return d;}
}
function face(d,m){
  const E={normal:['M-13,-147 L-13,-139','M13,-147 L13,-139'],happy:['M-19,-140 Q-14,-148 -9,-140','M9,-140 Q14,-148 19,-140'],
    tipsy:['M-20,-142 Q-17,-147 -14,-142 Q-11,-137 -8,-142','M8,-142 Q11,-147 14,-142 Q17,-137 20,-142'],
    smug:['M-19,-142 L-7,-142','M7,-142 L19,-142'],sad:['M-18,-147 L-8,-142','M18,-147 L8,-142']};
  E.laugh=E.happy;E.sweat=E.normal;
  if(m==='surprised'){d.circle(-13,-143,4,{over:.05});d.circle(13,-143,4,{over:.05});}else E[m].forEach(p=>d.path(p));
  const M={normal:'M-7,-122 Q0,-117 7,-122',happy:'M-11,-125 Q0,-112 11,-125',laugh:'M-13,-127 Q0,-104 13,-127Z',
    tipsy:'M-9,-121 Q-4,-116 1,-121 Q6,-126 11,-121',sweat:'M-8,-120 Q0,-125 8,-120',smug:'M-8,-121 Q3,-116 12,-127',sad:'M-8,-118 Q0,-126 8,-118'};
  if(m==='surprised')d.circle(0,-121,6,{over:.05});else d.path(M[m]);
  d.path(CIRC(-24,-127,6),{cls:'blush',fill:'var(--seal)'});d.path(CIRC(24,-127,6),{cls:'blush',fill:'var(--seal)'});
  if(m==='sweat')d.path('M31,-172 Q24,-159 31,-153 Q38,-159 31,-172',{color:'var(--cobalt)'});
}
function hat(d,h){
  const w=d.sw;
  switch(h){

const hz=n=>{const m=n.match(/^([A-G])(#?)(\d)$/);return 440*Math.pow(2,(12*(+m[3]+1)+NOTE[m[1]]+(m[2]?1:0)-69)/12);};
const BPM=112,SPB=60/BPM;
const MEL=`D5/.5 E5/.5 D5/.5 B4/.5 A4/1 B4/1|A4/.5 F#4/.5 E4/.5 F#4/.5 A4/2|B4/.5 D5/.5 E5/.5 F#5/.5 E5/1 D5/1|B4/.5 A4/.5 B4/.5 D5/.5 E5/2|
F#5/.5 E5/.5 D5/.5 E5/.5 D5/.5 B4/.5 A4/1|B4/.5 A4/.5 F#4/.5 E4/.5 F#4/1 A4/1|E4/.5 F#4/.5 A4/.5 B4/.5 A4/.5 F#4/.5 E4/1|D4/2 E4/.5 F#4/.5 A4/1|
A5/.5 R/.5 A5/.5 F#5/.5 E5/.5 F#5/.5 A5/1|B5/.5 A5/.5 F#5/.5 E5/.5 D5/2|E5/.5 F#5/.5 E5/.5 D5/.5 B4/.5 D5/.5 E5/1|A4/1 B4/.5 D5/.5 E5/2|
F#5/.5 A5/.5 F#5/.5 E5/.5 D5/1 E5/1|D5/.5 B4/.5 A4/.5 B4/.5 D5/2|E5/.5 D5/.5 B4/.5 A4/.5 F#4/.5 E4/.5 F#4/1|D4/2 R/1 A4/.5 B4/.5`;
const EV=[];let LOOP=0;
(()=>{let b=0;MEL.split('|').forEach(bar=>bar.trim().split(/\s+/).forEach(tok=>{const[n,l]=tok.split('/');if(n!=='R')EV.push({b,ty:'mel',f:hz(n),len:+l});b+=+l;}));LOOP=b;
  const ROOTS='D D B E D B A D D B E A B D A D'.split(' '),FIFTH={D:'A',B:'F#',E:'B',A:'E'},OCT={D:2,B:1,E:2,A:1},ARP={D:['D4','A4'],B:['B3','F#4'],E:['E4','B4'],A:['A3','E4']};
  ROOTS.forEach((r,i)=>{const s=i*4;
    EV.push({b:s,ty:'bass',f:hz(r+OCT[r]),len:1.4},{b:s+2,ty:'bass',f:hz(FIFTH[r]+'2'),len:.9},{b:s+3,ty:'bass',f:hz(r+OCT[r]),len:.8});
    [.5,1.5,2.5,3.5].forEach((o,k)=>EV.push({b:s+o,ty:'arp',f:hz(ARP[r][k%2])}));
    EV.push({b:s,ty:'drum',v:.55});if(i%2)EV.push({b:s+2.5,ty:'drum',v:.35});
    EV.push({b:s+1,ty:'wood'},{b:s+3,ty:'wood'},{b:s+3.5,ty:'wood',v:.12});
    for(let e=0;e<8;e++)EV.push({b:s+e*.5,ty:'shk',v:e%2?.05:.03});
    if(i%8===0)EV.push({b:s,ty:'cym'});});
  EV.sort((a,b)=>a.b-b.b);})();
function audioInit(){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=new C();A.ctx=ctx;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(ctx.destination);
  A.master=ctx.createGain();A.master.gain.value=A.muted?0:.9;A.master.connect(comp);
  const len=ctx.sampleRate*2.2,ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const conv=ctx.createConvolver();conv.buffer=ir;const rev=ctx.createGain();rev.gain.value=.24;rev.connect(conv);conv.connect(A.master);
  A.music=ctx.createGain();A.music.gain.value=.5;A.music.connect(A.master);A.music.connect(rev);
  A.fx=ctx.createGain();A.fx.gain.value=.75;A.fx.connect(A.master);A.fx.connect(rev);
  A.noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);{const d=A.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  A.i=0;A.loopStart=ctx.currentTime+.15;A.loopN=0;
  setInterval(schedule,25);
}
function ksBuf(f){const key=Math.round(f*10);if(A.ks[key])return A.ks[key];
  const ctx=A.ctx,sr=ctx.sampleRate,N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*1.6),buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const ring=new Float32Array(N);let pv=0;for(let i=0;i<N;i++){const r=Math.random()*2-1;ring[i]=(r+pv)*.5;pv=r;}
  const rho=Math.pow(.001,1/(f*1.4));let idx=0;
  for(let i=0;i<len;i++){const nx=(idx+1)%N,v=ring[idx];d[i]=v;ring[idx]=(v+ring[nx])*.5*rho;idx=nx;}
  return A.ks[key]=buf;}
function out(node,pan){if(pan&&A.ctx.createStereoPanner){const p=A.ctx.createStereoPanner();p.pan.value=pan;node.connect(p);return p;}return node;}
function pluck(time,f,vel,pan,len,bend){const ctx=A.ctx,s=ctx.createBufferSource();s.buffer=ksBuf(f);
  if(bend){s.playbackRate.setValueAtTime(.982,time);s.playbackRate.linearRampToValueAtTime(1,time+.07);}
  const g=ctx.createGain();g.gain.setValueAtTime(vel,time);g.gain.setTargetAtTime(0,time+len,.12);
  s.connect(g);out(g,pan).connect(A.music);s.start(time);s.stop(time+len+.8);}
function tone(time,type,f0,f1,dur,vel,dest,fdur){const ctx=A.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,time);if(f1)o.frequency.exponentialRampToValueAtTime(f1,time+(fdur||dur*.5));
  g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vel,time+.006);g.gain.exponentialRampToValueAtTime(.0001,time+dur);
  o.connect(g);g.connect(dest);o.start(time);o.stop(time+dur+.05);return o;}
function noise(time,dur,vel,ftype,freq,dest,q){const ctx=A.ctx,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=A.noise;f.type=ftype;f.frequency.value=freq;if(q)f.Q.value=q;
  g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vel,time+.005);g.gain.exponentialRampToValueAtTime(.0001,time+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(time,Math.random()*.5);s.stop(time+dur+.05);return f;}
function playEv(e,t){const ctx=A.ctx;switch(e.ty){
  case 'mel':pluck(t,e.f,.62,-.18,Math.max(.35,e.len*SPB*1.25),true);break;
  case 'arp':pluck(t,e.f,.17,.3,.35,false);break;
  case 'bass':{const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();o.type='triangle';o.frequency.value=e.f;lp.type='lowpass';lp.frequency.value=700;
    const d=e.len*SPB;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);
    o.connect(lp);lp.connect(g);g.connect(A.music);o.start(t);o.stop(t+d+.3);break;}
  case 'drum':tone(t,'sine',150,48,.42,e.v,A.music,.16);noise(t,.06,e.v*.25,'lowpass',900,A.music);break;
  case 'wood':tone(t,'triangle',1150,0,.07,e.v||.22,A.music);tone(t,'sine',1720,0,.05,(e.v||.22)*.4,A.music);break;
  case 'shk':if(A.loopN>0)noise(t,.045,e.v,'highpass',7000,A.music);break;
  case 'cym':noise(t,.7,.1,'bandpass',6200,A.music,.8);break;}}
function schedule(){const ctx=A.ctx;if(!ctx||ctx.state!=='running')return;const now=ctx.currentTime;
  for(;;){const e=EV[A.i],t=A.loopStart+e.b*SPB;if(t>now+.2)break;if(t>=now-.05)playEv(e,t);
    if(++A.i>=EV.length){A.i=0;A.loopStart+=LOOP*SPB;A.loopN++;}}}
function sfx(type){const ctx=A.ctx;if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime+.01,F=A.fx;switch(type){
  case 'gong':{const o=tone(t,'sine',600,760,1.1,.32,F,.28);tone(t,'sine',600*1.52,760*1.52,.7,.1,F,.28);noise(t,.08,.16,'bandpass',3200,F,1.5);void o;break;}
  case 'pop':tone(t,'sine',520,1100,.14,.22,F,.07);break;
  case 'stamp':tone(t,'sine',140,60,.22,.4,F,.12);noise(t,.07,.14,'lowpass',1200,F);break;
  case 'boom':noise(t,1.1,.9,'lowpass',380,F);tone(t,'sine',90,32,.8,.7,F,.5);break;
  case 'snip':noise(t,.03,.35,'highpass',4000,F);noise(t+.09,.03,.35,'highpass',4000,F);break;
  case 'whoosh':{const f=noise(t,.95,.32,'bandpass',300,F,1.3);f.frequency.exponentialRampToValueAtTime(2800,t+.8);break;}
  case 'spark':for(let k=0;k<9;k++)noise(t+k*.06+Math.random()*.04,.03,.18,'highpass',5000,F);tone(t,'sine',300,900,.25,.08,F);break;}}
function musicTo(v,tc){if(A.ctx)A.music.gain.setTargetAtTime(v,A.ctx.currentTime,tc||.2);}

/* ---------- player ---------- */
const track=$('track');
SC.forEach((sc,i)=>{const b=document.createElement('button');b.type='button';b.className='seg';b.style.flexGrow=sc.dur;b.title=sc.label;b.setAttribute('aria-label',`跳到：${sc.label}`);
  b.innerHTML='<span class="bar"><span class="fill"></span></span><span class="lb"></span>';b.querySelector('.lb').textContent=sc.label;
  b.addEventListener('click',e=>{e.stopPropagation();seek(starts[i]+.001);});track.appendChild(b);sc.seg=b;sc.fillEl=b.querySelector('.fill');});
let T=4.9,playing=false,started=false,lastNow=null,cur=-1,prevLocal=-1,lastCap=null,lastYear=null,lastSec=-1,boilK=0,lastBoil=0;
const idxAt=t=>{let i=SC.length-1;while(i>0&&starts[i]>t)i--;return i;};
function upd(it,L){switch(it.k){
  case 'draw':{const p=clamp((L-it.t)/it.dur),off=f1(it.len*(1-easeOut(p)));if(off!==it.o){it.e.style.strokeDashoffset=off;it.o=off;}
    if(it.fill)it.e.style.fillOpacity=clamp((L-it.t-it.dur*.6)/.35);else if(it.paper)it.e.style.fillOpacity=L>=it.t?1:0;break;}
  case 'type':{const n=L<it.t?0:Math.min(it.chars.length,Math.ceil((L-it.t)/it.dur*it.chars.length));if(n!==it.n){it.e.textContent=it.chars.slice(0,n).join('');it.n=n;}break;}
  case 'fade':it.e.style.opacity=clamp((L-it.t)/it.dur);break;
  case 'show':it.e.style.opacity=clamp((L-it.t)/.25);break;
  case 'wipe':it.r.setAttribute('width',f1(it.w*easeIO(clamp((L-it.t)/it.dur))));break;
  case 'pop':{const p=clamp((L-it.t)/it.dur);it.e.style.opacity=L<it.t?0:1;it.e.style.transform=`scale(${L<it.t?.01:backOut(p).toFixed(3)})`;break;}
  case 'move':it.e.setAttribute('transform',it.base+' '+it.fn(Math.max(0,L)));break;}}
function render(t,fire){
  const i=idxAt(t),sc=SC[i],L=t-starts[i];
  if(i!==cur){if(cur>=0){SC[cur].g.style.display='none';}sc.g.style.display='';cur=i;prevLocal=-1;
    SC.forEach((s,j)=>{s.seg.classList.toggle('on',j===i);s.fillEl.style.width=j<i?'100%':'0';});$('chapName').textContent=i?`第 ${i} 章 · ${sc.label}`:'开场';}
  if(fire&&A.ctx){if(i>0&&prevLocal<0)sfx('gong');sc.sfx.forEach(s=>{if(s.t>prevLocal&&s.t<=L)sfx(s.type);});}
  prevLocal=L;
  for(const it of sc.items)upd(it,L);
  sc.g.style.opacity=i<SC.length-1?1-clamp((L-(sc.dur-.35))/.35):1;
  const y=yearAt(i,L);if(y!==lastYear){yearEl.textContent=y;lastYear=y;}
  const cs=[...sc.caption],n=started?clamp(Math.floor((L-.3)*24),0,cs.length):0,cap=cs.slice(0,n).join('');if(cap!==lastCap){capEl.textContent=cap;lastCap=cap;}
  sc.fillEl.style.width=(started?clamp(L/sc.dur)*100:0)+'%';
  const sec=Math.floor(started?t:0);if(sec!==lastSec){$('timeTxt').textContent=`${fmtT(sec)} / ${fmtT(total)}`;lastSec=sec;}
}
function loop(now){
  if(playing){if(lastNow!=null)T+=Math.min(.1,(now-lastNow)/1000);if(T>=total){T=total;finish();}}
  lastNow=now;render(T,playing);
  if(!reduce&&now-lastBoil>140){boilK=(boilK+1)%3;art.setAttribute('filter',`url(#b${boilK})`);lastBoil=now;}
  requestAnimationFrame(loop);}
const ICO_PLAY='<path d="M7 4.5v15l13-7.5z"/>',ICO_PAUSE='<path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/>';
function syncBtn(){$('playIco').innerHTML=playing?ICO_PAUSE:ICO_PLAY;$('playBtn').setAttribute('aria-label',playing?'暂停':'播放');}
function begin(){
  if(!started||T>=total-.01){T=0;started=true;cur=-1;}
  if(!A.ctx)audioInit();
  if(A.ctx){A.ctx.resume();musicTo(.5,.1);}
  playing=true;$('start').hidden=true;syncBtn();}
function pause(){playing=false;if(A.ctx)A.ctx.suspend();syncBtn();}
function finish(){playing=false;syncBtn();musicTo(0,.6);setTimeout(()=>{if(!playing&&A.ctx)A.ctx.suspend();},2600);
  $('start').hidden=false;$('start').querySelector('.seal').textContent='重播';$('startHint').textContent='再看一遍';}
function toggle(){playing?pause():begin();}
function seek(t){if(!started){started=true;}T=clamp(t,0,total-.01);if(T<total-.02&&!playing&&$('start').querySelector('.seal').textContent==='重播'){$('start').hidden=true;}
  render(T,false);}
$('start').addEventListener('click',begin);
$('playBtn').addEventListener('click',toggle);
$('prevBtn').addEventListener('click',()=>{const i=idxAt(T);seek(T-starts[i]>1.5?starts[i]:starts[Math.max(0,i-1)]);});
$('nextBtn').addEventListener('click',()=>{const i=idxAt(T);if(i<SC.length-1)seek(starts[i+1]);});
function setMute(m){A.muted=m;if(A.ctx)A.master.gain.setTargetAtTime(m?0:.9,A.ctx.currentTime,.05);
  $('muteIco').innerHTML=m?'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  $('muteBtn').setAttribute('aria-label',m?'取消静音':'静音');}
$('muteBtn').addEventListener('click',()=>setMute(!A.muted));
let drag=false;
const tAtX=x=>{const r=track.getBoundingClientRect();return clamp((x-r.left)/r.width)*total;};
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);seek(tAtX(e.clientX));});
track.addEventListener('pointermove',e=>{if(drag)seek(tAtX(e.clientX));});
track.addEventListener('pointerup',()=>{drag=false;});track.addEventListener('pointercancel',()=>{drag=false;});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight'){$('nextBtn').click();}else if(e.key==='ArrowLeft'){$('prevBtn').click();}
  else if(e.key==='m'||e.key==='M'){setMute(!A.muted);}});
window.__seek=t=>{started=true;T=t;render(t,false);};
window.__total=total;window.__starts=starts;
render(T,false);requestAnimationFrame(loop);
})();
</script>
